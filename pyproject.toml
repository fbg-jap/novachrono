[project]
name = "novachrono"
version = "0.1.0"
description = "Self-hosted dashboard renderer for the Divoom Times Gate."
readme = "README.md"
authors = [
    { name = "Henning Steinberg", email = "139321709+drachenpapa@users.noreply.github.com" }
]
requires-python = ">=3.14,<3.15"
license = "MIT"
keywords = [
    "dashboard",
    "divoom",
    "pixel-display",
    "raspberry-pi",
    "times-gate",
]
dependencies = [
    "msal==1.39.0",
    "pillow==12.3.0",
    "python-dotenv==1.2.3",
    "typer==0.27.2",
    "tzdata==2026.3",
]

[project.urls]
Homepage = "https://github.com/drachenpapa/novachrono"
Repository = "https://github.com/drachenpapa/novachrono"
Issues = "https://github.com/drachenpapa/novachrono/issues"

[project.scripts]
novachrono = "novachrono.cli:app"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF",]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers",]
